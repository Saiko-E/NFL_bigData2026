<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">NFL Tracking Analytics</title>
  <desc id="desc">Architecture and field replay preview for the 2021 weeks one through eight tracking sample.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#10203a"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174c35"/><stop offset="1" stop-color="#0e3828"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="42" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">NFL TRACKING ANALYTICS</text>
  <text x="42" y="82" fill="#38bdf8" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">REAL 10 HZ REPLAY · 2021 WEEKS 1–8</text>
  <g transform="translate(42 112)">
    <rect width="760" height="350" rx="14" fill="url(#field)" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="55" y="18" width="650" height="314" fill="none" stroke="#e2e8f0" stroke-opacity=".72" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-opacity=".25">
      <path d="M120 18v314M185 18v314M250 18v314M315 18v314M380 18v314M445 18v314M510 18v314M575 18v314M640 18v314"/>
      <path d="M55 106h650M55 244h650" stroke-dasharray="5 11"/>
    </g>
    <path d="M298 174 C350 130 405 142 464 94" fill="none" stroke="#facc15" stroke-width="4" stroke-opacity=".8"/>
    <g fill="#38bdf8" stroke="#07101d" stroke-width="3">
      <circle cx="298" cy="174" r="13"/><circle cx="250" cy="105" r="13"/><circle cx="247" cy="243" r="13"/><circle cx="353" cy="73" r="13"/><circle cx="370" cy="278" r="13"/><circle cx="202" cy="174" r="13"/>
    </g>
    <g fill="#fb7185" stroke="#07101d" stroke-width="3">
      <circle cx="340" cy="174" r="13"/><circle cx="410" cy="105" r="13"/><circle cx="406" cy="243" r="13"/><circle cx="478" cy="73" r="13"/><circle cx="490" cy="278" r="13"/><circle cx="540" cy="174" r="13"/>
    </g>
    <ellipse cx="464" cy="94" rx="9" ry="6" fill="#9a5b27" stroke="#fff" stroke-width="2" transform="rotate(-28 464 94)"/>
    <circle cx="298" cy="174" r="23" fill="none" stroke="#facc15" stroke-width="3" filter="url(#glow)"/>
    <text x="380" y="323" fill="#fff" fill-opacity=".32" text-anchor="middle" font-family="Arial,sans-serif" font-size="12">STANDARDIZED FIELD · OFFENSE → +X</text>
  </g>
  <g transform="translate(830 112)" font-family="Arial,sans-serif">
    <rect width="328" height="102" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="22" y="28" fill="#94a3b8" font-size="12" letter-spacing="1.5">DATA PIPELINE</text>
    <text x="22" y="58" fill="#f8fafc" font-size="16" font-weight="700">CSV → Parquet → DuckDB</text>
    <text x="22" y="82" fill="#64748b" font-size="13">8.3M observed tracking rows</text>
    <rect y="122" width="328" height="102" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="22" y="150" fill="#94a3b8" font-size="12" letter-spacing="1.5">ANALYTICS</text>
    <text x="22" y="180" fill="#f8fafc" font-size="16" font-weight="700">Pressure · Matchups · Tactics</text>
    <text x="22" y="204" fill="#64748b" font-size="13">FastAPI + PFF scouting labels</text>
    <rect y="244" width="328" height="106" rx="14" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".22"/>
    <text x="22" y="274" fill="#38bdf8" font-size="12" letter-spacing="1.5">INTERACTIVE FIELD</text>
    <text x="22" y="304" fill="#f8fafc" font-size="16" font-weight="700">Frames · Trails · Vectors</text>
    <text x="22" y="328" fill="#64748b" font-size="13">Real positions, no synthetic paths</text>
  </g>
  <text x="42" y="496" fill="#64748b" font-family="Arial,sans-serif" font-size="12">NFL Big Data Bowl 2023 regional dataset · Descriptive sample analytics only</text>
</svg>
